<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink4you</title>
  <link rel="icon" type="image/x-icon" href="pink4you.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0e060a;
      overflow-x: hidden;
    }

    #app {
      min-height: 100vh;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
      background: #0e060a;
      color: #ffe0f0;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      border-bottom: 1px solid #ff69b433;
      padding-bottom: 1.5rem;
    }

    .logo {
      width: 42px; height: 42px;
      border: 1.5px solid #ff69b4;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      color: #ff69b4;
      box-shadow: 0 0 10px #ff69b433;
    }

    .title-block h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ffe0f0;
    }

    .tagline {
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ff8da1;
      margin-top: 4px;
    }

    .count-badge {
      font-size: 11px;
      padding: 2px 10px;
      border: 1px solid #ff69b444;
      border-radius: 20px;
      color: #ff69b4;
      margin-left: 8px;
      background: #ff69b411;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }

    .input-row input {
      flex: 1;
      min-width: 200px;
      height: 44px;
      padding: 0 16px;
      background: #1c0914;
      border: 1px solid #ff69b444;
      border-radius: 6px;
      font-size: 13px;
      font-family: monospace, sans-serif;
      color: #ffe0f0;
      outline: none;
      letter-spacing: 0.04em;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-row input:focus { 
      border-color: #ff69b4; 
      box-shadow: 0 0 8px #ff69b433;
    }

    .input-row input::placeholder { color: #8a3b63; }

    .add-btn {
      height: 44px;
      padding: 0 24px;
      background: #ff69b4;
      color: #0e060a;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace, sans-serif;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      white-space: nowrap;
      box-shadow: 0 0 12px #ff69b444;
    }

    .add-btn:hover { 
      background: #ff94cb; 
      box-shadow: 0 0 18px #ff69b466;
    }

    .add-btn:active { transform: scale(0.97); }

    .err-msg {
      font-size: 12px;
      color: #ff4466;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      padding-left: 2px;
      min-height: 18px;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ff69b4aa;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #ff69b422;
    }

    .link-list { 
      list-style: none; 
      flex: 1;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border: 1px solid #ff69b422;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #1a0b14;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
      overflow: hidden;
    }

    .link-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: #ff69b4;
      border-radius: 2px 0 0 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .link-item:hover { 
      border-color: #ff69b466; 
      background: #260e1d; 
    }

    .link-item:hover::before { opacity: 1; }

    .link-index {
      font-size: 11px;
      color: #ff69b488;
      min-width: 24px;
      letter-spacing: 0.05em;
    }

    .link-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ff69b4;
      box-shadow: 0 0 6px #ff69b4;
      flex-shrink: 0;
    }

    .link-anchor {
      flex: 1;
      font-size: 13px;
      color: #ffe0f0;
      text-decoration: none;
      letter-spacing: 0.03em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color 0.12s;
    }

    .link-anchor:hover { color: #ff69b4; }

    .link-host {
      font-size: 11px;
      color: #ff8da1aa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
      letter-spacing: 0.04em;
    }

    .del-btn {
      background: none;
      border: 1px solid #ff69b433;
      border-radius: 4px;
      width: 28px; height: 28px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: #ff69b488;
      font-size: 14px;
      flex-shrink: 0;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-family: monospace, sans-serif;
    }

    .del-btn:hover { 
      border-color: #ff4466; 
      color: #ff4466; 
      background: #ff446611;
    }

    .empty-state {
      text-align: center;
      padding: 5rem 0;
      color: #8a3b63;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="logo">◆</div>
      <div class="title-block">
        <h1>Linkvault <span class="count-badge" id="count-badge">0</span></h1>
        <div class="tagline">Cyber link archive</div>
      </div>
    </div>

    <div class="input-row">
      <input type="text" id="labelInput" placeholder="label (optional)">
      <input type="text" id="urlInput" placeholder="https://...">
      <button class="add-btn" onclick="addLink()">+ Add</button>
    </div>
    <div class="err-msg" id="err-msg"></div>

    <div class="section-label">// saved links</div>
    <ul class="link-list" id="linkList"></ul>
    <div class="empty-state" id="empty-state" style="display: none;">No links saved yet</div>
  </div>

  <script>
    const DEFAULTS = [
{ label: 'Hanime.tv', url: 'https://hanime.tv/' },
      { label: '', url: '' },
      { label: 'Hentaiyes.com', url: 'https://hentaiyes.com/tag/mind-control/' },
      { label: 'Hentaicloud.com', url: 'https://www.hentaicloud.com/search?search_type=videos&search_query=mind+control&search_type=videos' },
      { label: 'Miohentai.com', url: 'https://miohentai.com/search/' },
      { label: 'Hentaiworld.tv', url: 'https://hentaiworld.tv/?s=mind%20control' },
      { label: 'Hentai.tv', url: 'https://hentai.tv/?s=mind+control' },
      { label: 'Animeidhentai.com', url: 'https://animeidhentai.com/?s=mind+control' },
      { label: 'Hentaicity.com', url: 'https://www.hentaicity.com/search/video/hypnosis' },
      { label: 'HentaiFreak', url: 'https://hentaifreak.org/?s=mind+control' },
      { label: 'Hentai-moon.com', url: 'https://hentai-moon.com/search/mind-control/' },
      { label: 'Zhentube.com', url: 'https://zhentube.com/?s=mind+control' },
      { label: '', url: '' },
      { label: 'Joi-database', url: 'https://www.the-joi-database.com/' },
      { label: 'Hentai-wallpaper', url: 'https://www.theraphit.com/hentai-wallpaper/en/' },
      { label: 'lollipop', url: 'https://hentaiera.com/tag/lolicon/' },
      { label: '', url: '' }
    ];

    let links = localStorage.getItem('lv3_links_pink')
      ? JSON.parse(localStorage.getItem('lv3_links_pink'))
      : [...DEFAULTS];

    function save() { 
      localStorage.setItem('lv3_links_pink', JSON.stringify(links)); 
    }

    function render() {
      const list = document.getElementById('linkList');
      const empty = document.getElementById('empty-state');
      const badge = document.getElementById('count-badge');
      list.innerHTML = '';
      badge.textContent = links.length;
      empty.style.display = links.length ? 'none' : 'block';

      links.forEach((item, i) => {
        const li = document.createElement('li');
        li.className = 'link-item';

        const idx = document.createElement('span');
        idx.className = 'link-index';
        idx.textContent = String(i + 1).padStart(2, '0');

        const dot = document.createElement('span');
        dot.className = 'link-dot';

        const a = document.createElement('a');
        a.className = 'link-anchor';
        a.href = item.url;
        a.target = '_blank';
        a.textContent = item.label || item.url;
        a.title = item.url;

        const host = document.createElement('span');
        host.className = 'link-host';
        if (item.label) {
          try { host.textContent = new URL(item.url).hostname; } catch(e) {}
        }

        const del = document.createElement('button');
        del.className = 'del-btn';
        del.innerHTML = '&#215;';
        del.title = 'Remove';
        del.onclick = () => { links.splice(i, 1); save(); render(); };

        li.appendChild(idx);
        li.appendChild(dot);
        li.appendChild(a);
        li.appendChild(host);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function showErr(msg) {
      const el = document.getElementById('err-msg');
      el.textContent = msg;
      setTimeout(() => { el.textContent = ''; }, 2500);
    }

    function addLink() {
      const label = document.getElementById('labelInput').value.trim();
      const url = document.getElementById('urlInput').value.trim();
      if (!url) { showErr('// error: url required'); return; }
      if (!url.startsWith('http://') && !url.startsWith('https://')) { 
        showErr('// error: must start with http:// or https://'); 
        return; 
      }
      links.unshift({ label, url });
      save();
      render();
      document.getElementById('labelInput').value = '';
      document.getElementById('urlInput').value = '';
    }

    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addLink();
    });

    render();
  </script>
</body>
</html>
