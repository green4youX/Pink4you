<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pink4You</title>
<link rel="icon" type="image/png" href="pink4you.png">

<style>
html,body{
    margin:0;
    height:100%;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 50% 0%,rgba(255,105,180,.15),transparent 60%),
        radial-gradient(circle at 90% 90%,rgba(255,105,180,.10),transparent 55%),
        linear-gradient(180deg,#0e060a 0%,#140b10 40%,#090507 100%);
    font-family:"Segoe UI",Arial,sans-serif;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,105,180,.08) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,105,180,.08) 1px,transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(circle at 50% 30%,black,transparent 75%);
    pointer-events:none;
}

.menu{
    display:flex;
    flex-direction:column;
    gap:25px;
    align-items:center;
}

h1{
    color:#ff69b4;
    font-size:60px;
    margin-bottom:25px;
    letter-spacing:4px;
    text-transform:uppercase;
    text-shadow:
        0 0 10px #ff69b4,
        0 0 20px #ff69b4,
        0 0 40px #ff69b4;
}

.glow-btn{
    width:260px;
    text-align:center;
    padding:16px;
    font-size:20px;
    font-weight:bold;
    text-decoration:none;
    color:#ff69b4;
    background:rgba(30,0,15,.6);
    border:2px solid #ff69b4;
    border-radius:10px;
    box-shadow:
        0 0 8px #ff69b4,
        0 0 18px #ff69b4,
        inset 0 0 8px rgba(255,105,180,.2);
    text-shadow:0 0 8px #ff69b4;
    transition:.25s;
}

.glow-btn:hover{
    background:rgba(255,105,180,.15);
    transform:scale(1.05);
    box-shadow:
        0 0 12px #ff69b4,
        0 0 28px #ff69b4,
        0 0 40px rgba(255,105,180,.6);
}
</style>
</head>
<body>

<div class="menu">

<a class="glow-btn" href="https://sites.google.com/view/green40you/home" target="_blank" rel="noopener noreferrer">Green40you</a>
<a class="glow-btn" href="https://sites.google.com/view/greenfouryou/home" target="_blank" rel="noopener noreferrer">Greenfouryou</a>

</div>

</body>
</html>
